<rect class="bar2 fo" x="420" y="214" width="66" height="6" rx="3" fill="var(--bar)" style="transform-origin:left center;animation-delay:0.0s"/></g><g class="sl" style="animation-delay:0.72s"><rect x="40" y="232" width="540" height="22" rx="7" fill="var(--card)" stroke="var(--line)"/><circle cx="56" cy="243" r="4" fill="var(--warn)"/><text x="70" y="247" font-size="12.5" font-weight="500">Link para arquivo local</text><rect class="bar2 fo" x="420" y="240" width="59" height="6" rx="3" fill="var(--bar)" style="transform-origin:left center;animation-delay:0.9s"/></g><g class="sl" style="animation-delay:0.84s"><rect x="40" y="258" width="540" height="22" rx="7" fill="var(--card)" stroke="var(--line)"/><circle cx="56" cy="269" r="4" fill="var(--warn)"/><text x="70" y="273" font-size="12.5" font-weight="500">Texto pequeno demais</text><rect class="bar2 fo" x="420" y="266" width="63" height="6" rx="3" fill="var(--bar)" style="transform-origin:left center;animation-delay:1.8s"/></g><g class="sl" style="animation-delay:0.96s"><rect x="40" y="284" width="540" height="22" rx="7" fill="var(--card)" stroke="var(--line)"/><circle cx="56" cy="295" r="4" fill="var(--bad)"/><text x="70" y="299" font-size="12.5" font-weight="500">Contraste baixo</text><rect class="bar2 fo" x="420" y="292" width="46" height="6" rx="3" fill="var(--bar)" style="transform-origin:left center;animation-delay:2.7s"/></g><rect x="620" y="40" width="304" height="248" rx="14" fill="var(--card)" stroke="var(--line)"/><g class="vbad"><circle cx="672" cy="112" r="30" fill="var(--bad)"/><path d="M660 100l24 24m0-24-24 24" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="772" y="196" font-size="24" font-weight="700" text-anchor="middle">Precisa de atenção</text><text x="772" y="222" font-size="14" text-anchor="middle" class="mut">2 erros · 2 avisos</text></g><g class="vok fo"><circle cx="672" cy="112" r="30" fill="var(--ok)"/><path d="M658 112l10 10 18-20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="772" y="196" font-size="24" font-weight="700" text-anchor="middle">Pronto para apresentar</text><text x="772" y="222" font-size="14" text-anchor="middle" class="mut">Nenhum erro nem aviso</text></g></svg>
