<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="t d">
<title id="t">SlideReady: problemas do .pptx viram um veredito</title><desc id="d">O SlideReady marca o que vai dar problema em cada slide e muda de Precisa de atenção para Pronto para apresentar quando tudo é resolvido.</desc>
<style>
:root{--bg:#f1eeea;--card:#fbf9f6;--line:#d7d0c7;--ink:#1c1713;--mut:#6a6158;--bar:#d3cbc1;--acc:#dc4a12;--accc:#ffffff;--mark:#fadfd0;--ok:#1f8a5b;--bad:#d1342a;--warn:#c98200}
@media (prefers-color-scheme:dark){:root{--bg:#14100e;--card:#1d1815;--line:#3a322c;--ink:#f3ece6;--mut:#ab9f95;--bar:#554a41;--acc:#ff7b47;--accc:#1d0a02;--mark:#4a2412;--ok:#4fcf9b;--bad:#ff8a80;--warn:#f2b84b}}
text{font-family:'Hanken Grotesk','Segoe UI',-apple-system,system-ui,sans-serif;fill:var(--ink)}
.mut{fill:var(--mut)}
.fo{transform-box:fill-box}

.dot{animation:dot 10s infinite both;transform-origin:center}
.d2{animation-delay:.15s}.d3{animation-delay:.3s}.d4{animation-delay:.45s}
@keyframes dot{0%,8%{opacity:0;transform:scale(.3)}14%{opacity:1;transform:scale(1.2)}18%,40%{opacity:1;transform:scale(1)}46%,100%{opacity:0}}
.tick{animation:tick 10s infinite both;transform-origin:center}
.t1{animation-delay:0s}.t2{animation-delay:.9s}.t3{animation-delay:1.8s}.t4{animation-delay:2.7s}
@keyframes tick{0%,42%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.2)}54%,92%{opacity:1;transform:scale(1)}98%,100%{opacity:0}}
.vbad{animation:vbad 10s infinite both}
@keyframes vbad{0%,56%{opacity:1}64%,100%{opacity:0}}
.vok{animation:vok 10s infinite both}
@keyframes vok{0%,60%{opacity:0;transform:scale(.97)}70%,92%{opacity:1;transform:none}98%,100%{opacity:0}}
.sl{animation:sl 10s infinite both}
@keyframes sl{0%,2%{opacity:0;transform:translateY(10px)}8%,100%{opacity:1;transform:none}}
.bar2{animation:b2 10s infinite both;transform-origin:left center}
@keyframes b2{0%,50%{transform:scaleX(1)}66%,92%{transform:scaleX(.0)}100%{transform:scaleX(1)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="960" height="320" rx="16" fill="var(--bg)"/>
