name: Idea
description: Something SlideReady could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation first, then what is hard about it today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working. A rough sketch is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
