name: Bug report
description: Something in SlideReady does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please do not attach real personal data or real documents; made-up examples are enough.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: As exact as you can, starting from opening the app.
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Windows 11
        - Windows 10
        - macOS on Apple silicon
        - macOS on Intel
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the About window.
      placeholder: 0.1.0
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: A screenshot of the window is welcome; for the input, describe or recreate it with made-up data.
