[package]
name = "slideready"
version = "0.1.0"
description = "Check a .pptx before you present."
authors = ["Yan Suzano"]
license = "MIT"
repository = "https://github.com/yanmfs/SlideReady"
edition = "2021"

[lib]
name = "slideready_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
fontdb = "0.24"
notify = "8"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
